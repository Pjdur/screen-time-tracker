<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Time Tracker</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
      }
      h1 { font-size: 2rem; color: #333; margin-bottom: 5px; }
      #time-display {
        font-size: 3.5rem;
        font-weight: bold;
        color: #2c3e50;
        margin: 10px 0 20px 0;
      }
      .history-container {
        width: 80%;
        max-width: 400px;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      .history-container h2 {
        font-size: 1.2rem;
        margin-top: 0;
        color: #444;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        padding: 8px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }
      th { color: #666; font-size: 0.9rem; }
      td { font-size: 0.95rem; color: #222; }
    </style>
  </head>
  <body>
    <h1>Screen Time Tracker</h1>
    <div id="time-display">Loading...</div>

    <div class="history-container">
      <h2>Usage History</h2>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Time Used</th>
          </tr>
        </thead>
        <tbody id="history-body">
          <!-- Rows inserted by main.ts -->
        </tbody>
      </table>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
